# ============================================================================
# 拼读谐音映射表 —— WP-BE-04 / 需求 §6.2
#
# 作用：把云 ASR 对「念字母」的识别结果，还原成纯字母序列，再与目标拼写比对。
#
# 三层结构（匹配优先级从高到低，命中即停）：
#   1. `words`   —— **整串**精确匹配（归一化大小写与空白后）。用于 ASR 把整串
#                    音译成一个自然词/中文音译词的场景，如「克拉斯」→ class。
#   2. `tokens`  —— **多词组合**匹配（贪心取最长），如 "double u" → w。
#   3. `letters` —— 单 token / 逐字符匹配，是覆盖面最大的兜底层。
#                    「西 艾尔 诶 艾斯 艾斯」→ c l a s s ；「C L A S S」亦然。
#
# ⚠️ 扩容纪律（需求 §6.2 / 预研结论 `qa/ASR预研报告.md` §3.2）：
#    按**实测未命中**的词条来补，不要凭想象批量堆数据 —— 表里每多一条歧义读音，
#    就多一条把错读判对的风险。设计上**不做模糊猜测**：查不到就原样保留，
#    由后续「去非字母」自然丢弃，绝不猜字母。
#
# 冲突处理：同一读音映射到多个字母时，**保留先出现的**并记 warning
#    （见 homophone.py `_build_reverse_index`），因此字母按 A→Z 顺序书写，
#    优先级高的读音写在前面。
# ============================================================================

version: 1

# ---------------------------------------------------------------------------
# 第三层：单字母读音（英文读音 + 中文谐音）
#
# 每个字母的第一个元素固定为它自己（小写），保证「直接念字母名」一定命中。
# ---------------------------------------------------------------------------
letters:
  A: ["a", "ay", "aye", "诶", "唉", "阿", "啊"]
  B: ["b", "bee", "be", "比", "碧", "逼"]
  # ⚠️ 不加「丝」：与 S 的「斯」同音，会把 s 错映射成 c（宁缺勿滥）
  C: ["c", "see", "sea", "西", "稀"]
  D: ["d", "dee", "迪", "第", "地"]
  E: ["e", "ee", "伊", "衣", "一"]
  F: ["f", "ef", "eff", "艾弗", "艾付"]
  G: ["g", "gee", "吉", "记", "忌"]
  H: ["h", "aitch", "etch", "艾尺", "诶尺"]
  I: ["i", "eye", "艾", "爱", "哎"]
  J: ["j", "jay", "杰", "界", "借"]
  K: ["k", "kay", "凯", "开", "慨"]
  L: ["l", "ell", "el", "艾尔", "艾勒", "艾欧", "艾路"]
  M: ["m", "em", "艾姆", "姆", "嗯"]
  N: ["n", "en", "艾恩", "恩"]
  O: ["o", "oh", "欧", "哦", "噢"]
  P: ["p", "pee", "pea", "皮", "披", "屁"]
  Q: ["q", "cue", "queue", "丘", "扣", "球"]
  # ⚠️ 必须有 "are"：ASR 听 /ɑːr/（R 的读音）常返回 "are"，若只登记 "ar"，
  #    会被逐字符最长匹配拆成 "ar"+"e" → "re"，凭空多一个字母。
  R: ["r", "ar", "are", "阿尔", "儿", "啊儿"]
  S: ["s", "ess", "艾斯", "艾丝", "斯", "死"]
  T: ["t", "tee", "tea", "提", "梯", "踢"]
  U: ["u", "you", "优", "有", "尤"]
  V: ["v", "vee", "维", "微", "威", "为"]
  W: ["w", "达不溜", "打不留", "大不溜"]
  X: ["x", "ex", "艾克斯", "爱克斯"]
  Y: ["y", "why", "歪", "外", "怀"]
  Z: ["z", "zee", "zed", "贼", "再德", "则德"]

# ---------------------------------------------------------------------------
# 第二层：多词组合（必须**先于** letters 匹配，否则 "double" 会先被当单 token 处理）
# ---------------------------------------------------------------------------
tokens:
  "double u": "w"
  "double you": "w"
  "double yu": "w"
  "w w": "w"

# ---------------------------------------------------------------------------
# 第一层：整串精确匹配
#
# 用于 ASR **没能逐字母识别**、而是把整串听成一个自然词或中文音译词的场景。
# 这类结果无法用逐字母规则还原（「克拉斯」是三音节音译，对应 class 五个字母，
# 不存在一一映射），只能整串登记。
# ---------------------------------------------------------------------------
words:
  "class": "class"          # ASR 直接返回原词（连读念法 / 单字母连读归一化后）
  "克拉斯": "class"
  "克拉丝": "class"

  "apple": "apple"
  "阿婆": "apple"
  "艾婆": "apple"

  "glass": "glass"
  "格拉斯": "glass"
  "格拉丝": "glass"

  "desk": "desk"
  "戴斯克": "desk"
  "得斯克": "desk"

  "book": "book"
  "布克": "book"
  "不克": "book"

  "teacher": "teacher"
  "提彻": "teacher"
  "踢车": "teacher"
