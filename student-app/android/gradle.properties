org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# 固定构建用 JDK：Gradle 9.3.1 要求 JVM 17+，机器级 JAVA_HOME 是 1.8，
# 这里显式指向 Android Studio 自带 JBR（Java 25），不依赖 cmd 环境变量。
org.gradle.java.home=D:/2install/androidstudiotool/dir/jbr
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# compileSdk 抬到 37（permission_handler 13.x 要求），高于 AGP 9.1.0 的推荐上限 36，
# 这里显式声明以抑制 AGP 的“unsupported compileSdk”提示。
android.suppressUnsupportedCompileSdk=37

# ---------------------------------------------------------------------------
# 依赖下载健壮性（2026-09-29 加）—— 防「构建无限期挂死」
# 症状：`flutter build apk` 卡在 `Downloading ... repo.maven.apache.org/...jar`
# （Apache HttpClient 复用了连接池里一条已失效的连接，而 Gradle 默认**没有**
#  socket 读超时 → 永久阻塞，实测挂过 23 分钟、日志零输出）。
# 处置：显式设超时 + 重试，让坏连接尽快失败并换新连接重试。
# 依据：jstack 抓栈定位到 `ProgressLoggingInputStream.read → SSLSocketInputRecord.readFully`
#      阻塞；同时 curl/裸 Java(HttpURLConnection) 取同一 URL 均 200/1s 内返回。
# ---------------------------------------------------------------------------
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000
systemProp.org.gradle.internal.repository.max.retries=5
systemProp.org.gradle.internal.repository.initial.backoff=500
